<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `wasm-unsafe-eval` is required and narrow: Shiki's TextMate grammar engine is
      WebAssembly, and 'wasm-unsafe-eval' permits compiling WASM modules without permitting
      eval() of JavaScript strings. Without it `renderToHtml` rejects at the highlighter, and
      because the read pane had no error handling that presented as a permanently blank
      preview rather than a failure anyone could see.

      Do not "fix" a blank preview by adding plain 'unsafe-eval'. That would re-open eval for
      injected script, which is the thing this policy exists to prevent.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: file:; script-src 'self' 'wasm-unsafe-eval'; form-action 'none'; base-uri 'none'"
    />
    <title>Valence</title>
    <!-- House fonts are bundled: see styles/tokens.css. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
