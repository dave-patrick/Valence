name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact: 'release/*.zip'
          - os: ubuntu-latest
            script: build:linux
            artifact: 'release/*.AppImage'
          - os: macos-latest
            script: build:mac
            artifact: 'release/*.dmg'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        # bash, not the runner's default shell: the windows runner defaults to
        # PowerShell, which does not understand ${VAR#prefix}.
        shell: bash
        run: |
          # The tag, the version in package.json, and the name of the uploaded asset
          # have to be the same number. When they drift, the auto-updater compares the
          # app's own version against the tag and finds a newer release forever -- the
          # user gets offered the same update on every launch.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json $PKG_VERSION"

      - name: Build
        run: pnpm ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: valence-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          # A build that produces no artifact is a failed release, not a warning. v0.1.4
          # shipped green with no Windows build at all because the glob pointed at the old
          # output name and this step shrugged. Anyone downloading was handed nothing.
          if-no-files-found: error

  # Building is not running. This job launches the packaged app and checks that the window
  # opens, the preload bridge loads, and a file round-trips through it -- the three failures
  # that shipped to users while every other check stayed green.
  #
  # This ran green under xvfb on v0.1.8, so it is a blocking gate: if the app cannot start,
  # there is no release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Electron's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - name: Package unpacked
        run: pnpm build && npx electron-builder --linux --dir --publish never

      - name: Launch it and check
        run: xvfb-run -a node scripts/verify-package.mjs release/linux-unpacked/valence

  release:
    needs: [build, verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: RELEASE-NOTES.md
          draft: false
          prerelease: false
